# ================================================================
#  mpv 配置  |  Windows 11 + NVIDIA GPU（测试于 RTX 4080 SUPER）
#  文件位置: portable_config/mpv.conf
#  修改后重启 mpv 生效；以 # 开头为注释
# ================================================================

# ---------------- 基础行为 ----------------
# 无文件启动时也保留窗口，可双击 mpv.exe 当播放器用
idle=yes
force-window=yes
# 播放完卸载文件并进入空闲窗口（配合 idle=yes，窗口不会消失）
# 这样"看完再关窗"不会把片尾当成续播点；想停留最后一帧可改成 yes
keep-open=no
# 退出时记住播放进度，下次打开同一文件自动续播
save-position-on-quit=yes
resume-playback=yes
# 允许视频所在文件夹放一个 mpv.conf 做单独覆盖
use-filedir-conf=yes
# 预读播放列表，切下一集更快
prefetch-playlist=yes

# ---------------- 渲染 / 画质 ----------------
# 新渲染管线 libplacebo：色彩、缩放、HDR 都更强
vo=gpu-next
# Windows 下 D3D11 最稳；想试 Vulkan 改成 vulkan
gpu-api=d3d11
# 硬件解码（NVIDIA 上实际会选 d3d11va）
hwdec=auto-safe
# 高质量渲染预设：ewa_lanczossharp 缩放 + 色度重建 + 抖动
profile=gpu-hq
# 缩放算法（gpu-hq 已设置，这里显式写出方便调整）
scale=ewa_lanczossharp
# gpu-next 没有 ewa_lanczossoft，色度用 lanczos（想更锐可改 ewa_lanczos）
cscale=lanczos
dscale=mitchell
# 去色带 / 抖动：对动画、低码率片源提升明显
dither-depth=auto
deband=yes
deband-iterations=4
deband-threshold=48
deband-range=16
deband-grain=24
# HDR：gpu-next + D3D11 下 auto 已能正确输出 HDR 元数据
# 显示器/驱动有异常时可显式改成 yes 或 no
target-colorspace-hint=auto
# 显示器有校色 ICC 文件时可开启（可能略增 GPU 负载）
# icc-profile-auto=yes
# 可选补帧（低帧率→高刷），画面更顺但有肥皂剧效应
# video-sync=display-resample
# interpolation=yes
# tscale=oversample

# ---------------- 音频 ----------------
# Windows 上 WASAPI 输出
ao=wasapi
# 独占模式音质更纯净，但会占用声卡；需要时再开
# audio-exclusive=yes
volume-max=150

# ---------------- 字幕 ----------------
# 自动加载同名字幕；fuzzy 能命中 .zh-CN/.chs/.ass 等命名
sub-auto=fuzzy
# 额外在这些子目录找字幕（Windows 路径列表用分号）
sub-file-paths=sub;subs;subtitles;字幕
# 内嵌字幕优先选中文
slang=chi,zh-Hans,zh-CN,zh,eng
# 字幕字体/大小/描边（中文用微软雅黑，避免方块字）
sub-font='Microsoft YaHei UI'
sub-font-size=42
sub-border-size=2.2
sub-shadow-offset=1.0
sub-blur=0.3
# ASS 字幕保留原排版，只做缩放；想强制统一样式改为 force
sub-ass-override=scale

# ---------------- 界面 / OSD ----------------
# uosc 接管界面，关闭 mpv 自带 OSC
osc=no
# uosc 自己画进度/音量指示，关掉内置 OSD 条避免重复
osd-bar=no
osd-duration=2500
osd-font-size=34
# 窗口最大不超过屏幕 90%，避免 4K 视频开满屏
autofit-larger=90%x90%
# 光标 1 秒后自动隐藏
cursor-autohide=1000

# ---------------- 截图 ----------------
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory=~~/screenshots
screenshot-template='%F-%#03n'

# ---------------- 缓存 ----------------
# 网络流自动缓存；本地文件不额外占内存
cache=auto
demuxer-max-bytes=1024MiB
demuxer-max-back-bytes=512MiB
demuxer-readahead-secs=20

# ---------------- 在线视频（需安装 yt-dlp） ----------------
ytdl-format=bv*+ba/b

# ---------------- 调试 ----------------
# 日志：排查字幕/脚本问题时看 portable_config\mpv.log
log-file=~~/mpv.log
# 只记录中文字幕脚本的 info 信息，避免日志过大
msg-level=subs_cn=info

# 关闭 mpv 内置的"按住左键拖动窗口"；否则拖动进度条/音量条时会带着窗口跑
input-builtin-dragging=no
