# ================================================================
#  uosc 界面配置 — B 站风格：细线进度条 + 精简控制栏
#  完整选项文档：script-opts/uosc.conf.example
# ================================================================

# 界面语言 + 字幕搜索语言
# zh-hans 用于界面中文化；zh-cn / zh-tw 用于 OpenSubtitles 搜索
languages=zh-hans,zh-cn,zh-tw

# 鼠标离开后自动隐藏界面
autohide=yes

# ---------------- 进度条（B 站式细线） ----------------
timeline_style=line
# 线宽 2px
timeline_line_width=2
# 悬浮时展开的高度，越小越不挡画面
timeline_size=18
# 去掉顶部边框
timeline_border=0
# 不显示缓冲纹理（更干净）
timeline_cache=no
# 不显示 YouTube 热力图
timeline_heatmap=no
# 鼠标滚轮在进度条上每次跳 5 秒
timeline_step=5
# 窗口模式下在底部保留一条极细进度线
progress=windowed
progress_size=2
progress_line_width=18

# ---------------- 控制栏（精简为 B 站式） ----------------
# 左：播放/暂停；中：字幕/音轨；右：速度、上下集、列表（有播放列表时）、全屏、设置
controls=play-pause,gap,<video,audio>subtitles,<has_many_audio>audio,gap,space,<video,audio>speed,space,prev,<has_playlist>items,next,gap,fullscreen,command:settings:script-binding uosc/menu
controls_size=24
controls_margin=6
controls_spacing=2

# ---------------- 音量条（细） ----------------
volume=right
volume_size=28
volume_border=0

# ---------------- 其他 ----------------
# 右侧时间显示总时长（B 站是 当前/总时长）
destination_time=total
# 隐藏章节菱形标记，保持干净
opacity=timeline=0.8,position=1,chapters=0,slider=0.8,menu=0.95
# 更小的圆角
border_radius=6
animation_duration=80

# ---------------- IINA 风格自定义 OSC ----------------
# 由 scripts/iina_osc.lua 接管；禁用 uosc 自带的对应元素
disable_elements=timeline,controls,volume,top_bar,pause_indicator

# ---- 紧凑弹窗（配合 IINA 浮动条） ----
menu_item_height=26
menu_min_width=190
menu_padding=3
font_scale=0.92
