# ================================================================
#  iina_osc.lua — IINA 风格浮动控制条
# ================================================================

# 整体缩放（1 = 跟随系统 DPI）
scale=1

# 浮动条尺寸（逻辑点，IINA 默认 460 × 68）
bar_width=460
bar_height=68

# 距离窗口底部（逻辑点）
bottom_margin=25

# 鼠标静止多久后隐藏（秒；IINA 默认 2.5）
autohide_timeout=2.5

# 背景不透明度（0 透明，1 不透明）
background_opacity=0.88

# 图标字体（Material Icons Outlined）
icon_font=MaterialIconsOutlined-Regular

# 时间字体（等宽数字）
time_font=Consolas

# 选集弹窗显示行数（3-12）
playlist_rows=6

# 设置/选集弹窗背景不透明度
popover_opacity=0.94
