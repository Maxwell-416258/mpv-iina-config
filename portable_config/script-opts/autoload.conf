# ================================================================
#  autoload.lua — 自动加载同目录媒体，实现"下一集"连播
# ================================================================

disabled=no
# 只加载同类型文件（视频只配视频，音频只配音频）
same_type=yes
videos=yes
audio=yes
images=no
ignore_hidden=yes
# lazy：只扫当前目录；recursive：连子目录一起扫
directory_mode=lazy
# 忽略的文件名模式（Lua 模式，逗号分隔）
ignore_patterns=^~,^bak-,%.bak$
