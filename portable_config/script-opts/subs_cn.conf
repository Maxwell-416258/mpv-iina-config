# ================================================================
#  subs_cn.lua 配置 — 一键中文字幕搜索
# ================================================================

# OpenSubtitles API key
# 默认使用 uosc 内置的公共 key（每天 5 次下载）
api_key=b0rd16N0bp7DETMpO4pYZwIqmQkZbYQr

# User-Agent，OpenSubtitles 要求 appname v1.0 格式
agent=mpv-subs-cn v1.0

# 搜索语言：简体优先，繁体兜底；只搜中文
languages=zh-cn,zh-tw

# OpenSubtitles 没有中文时，自动转 Assrt（射手网）搜索
# Assrt 不需要 API key，免费；下载的字幕会缓存到 portable_config/cache/subs_cn
use_assrt=yes

# 每次菜单最多显示多少条 OpenSubtitles 结果
max_items=20
