# ================================================================
#  input.conf — 快捷键（只写覆盖项，其余沿用 mpv 默认）
#  路径: D:\Software\Applications\mpv\portable_config\input.conf
# ================================================================

# ---- 播放 / 暂停 ----
SPACE cycle pause
p cycle pause

# ---- 快退 / 快进 ----
# 左右：5 秒；Ctrl+左右：按字幕跳转（默认）
LEFT seek -5
RIGHT seek 5
# Shift+上下：60 秒（配合下面把上下改成音量）
Shift+UP seek 60
Shift+DOWN seek -60

# ---- 音量（IINA / YouTube 习惯） ----
UP add volume 5
DOWN add volume -5
m cycle mute

# ---- 全屏 / 置顶 ----
f cycle fullscreen
T cycle ontop

# ---- 截图 ----
# s：带字幕；S：不带字幕；Ctrl+s：带 OSD 的窗口截图
s screenshot
S screenshot video
Ctrl+s screenshot window

# ---- 播放速度（默认： [ ] 微调，{ } 减半/加倍，BS 复位） ----
# [ multiply speed 1/1.1
# ] multiply speed 1.1
# { multiply speed 0.5
# } multiply speed 2.0
BS set speed 1

# ---- 字幕 ----
# 右键菜单“字幕”子项（按此顺序显示）
# Ctrl+d：自动清洗文件名、搜索并加载中文字幕
Ctrl+d script-binding subs_cn/find #! 字幕 > 自动搜索中文字幕
# Ctrl+Shift+d：打开 uosc 手动搜索菜单（可自己改片名）
Ctrl+Shift+d script-binding uosc/download-subtitles #! 字幕 > 手动搜索字幕
#    script-binding uosc/subtitles #! 字幕 > 字幕轨道
#    script-binding uosc/load-subtitles #! 字幕 > 加载本地字幕
v cycle sub-visibility #! 字幕 > 显示/隐藏字幕

j cycle sub
J cycle sub down
z script-message-to subs_cn delay-down 0.1
Z script-message-to subs_cn delay-up 0.1

# ---- 字幕同步 ----
# Alt+Z 延迟 1 秒，Alt+X 提前 1 秒；偏移会自动保存到视频旁边
Alt+z script-message-to subs_cn delay-up 1 #! 字幕同步 > 延迟 1 秒
Alt+x script-message-to subs_cn delay-down 1 #! 字幕同步 > 提前 1 秒
#    script-message-to subs_cn delay-up 0.1 #! 字幕同步 > 延迟 0.1 秒
#    script-message-to subs_cn delay-down 0.1 #! 字幕同步 > 提前 0.1 秒
#    script-message-to subs_cn delay-reset #! 字幕同步 > 重置为 0
#    script-message-to subs_cn save-delay-dir #! 字幕同步 > 保存为整季偏移

# ---- 音轨 ----
a cycle audio #! 音轨

# ---- 播放列表 / 章节（右键菜单） ----
#    script-binding uosc/playlist #! 播放列表
#    script-binding uosc/chapters #! 章节

# ---- 循环 ----
# l：A-B 循环；L：单文件循环开关（均沿用默认）
# l ab-loop
# L cycle-values loop-file inf no

# ---- 播放列表 ----
ENTER playlist-next force
< playlist-prev
> playlist-next

# ---- 逐帧 ----
, frame-back-step
. frame-step

# ---- 章节 ----
PGUP add chapter 1
PGDWN add chapter -1

# ---- 窗口缩放 ----
Alt+0 set window-scale 0.5
Alt+1 set window-scale 1.0
Alt+2 set window-scale 2.0

# ================================================================
#  uosc 界面快捷键
# ================================================================
# 打开文件
o script-binding uosc/open-file #! 打开文件
# 截图（右键菜单）
s screenshot #! 截图（带字幕）
# 显示 / 隐藏界面（只看画面的沉浸模式）
TAB script-message-to iina_osc toggle
# 快捷键帮助面板
F1 script-binding uosc/keybinds #! 快捷键
# 退出（右键菜单）
#    quit #! 退出
# 右键菜单
MBTN_RIGHT script-binding uosc/menu

# ---- IINA 风格 OSC 左键 ----
# 单击暂停/双击全屏，以及控制条按钮/进度条/音量条
MBTN_LEFT script-message-to iina_osc click

# ---- IINA 风格 OSC 滚轮 ----
# 鼠标在进度条上：滚轮快进/快退 5 秒；在选集弹窗里：滚动列表；否则音量 ±2
WHEEL_UP script-message-to iina_osc wheel -1
WHEEL_DOWN script-message-to iina_osc wheel 1
